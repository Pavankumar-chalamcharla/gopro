name: Android CI

# Builds and tests the app entirely on GitHub's hosted runners — no local
# Android Studio install required. Triggers on every push/PR to main, and
# can also be run manually from the Actions tab (workflow_dispatch).
#
# This project intentionally does NOT commit a Gradle wrapper jar (it's a
# binary file). Instead, this workflow installs a specific Gradle version
# via gradle/actions/setup-gradle and invokes `gradle` directly. If you
# also want to build locally without Android Studio, install Gradle 8.9
# yourself (e.g. via sdkman: `sdk install gradle 8.9`) and run the same
# `gradle` commands used below.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK platform & build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Run unit tests
        run: gradle test --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eis-camera-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: warn
